name: Bug report
description: Something in Diagramble does not work as it should.
labels: ["bug"]
body:
  - type: input
    id: where
    attributes:
      label: Where it happens
      description: The screen, and the rule code if a finding is wrong (for example BAL-01).
      placeholder: Data flow diagram, Level 0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the sample project
        2. Add a flow from Client to process 1
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: Include error messages or screenshots. Remove students' names and work first.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: Firefox 140 on Windows 11
