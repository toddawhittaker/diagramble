name: CI

on:
  pull_request:
    branches: [main, "epic/**"]
  push:
    branches: [main, "epic/**"]

permissions:
  contents: read

# A new push to a pull request cancels that pull request's run on the
# older commit, so the run that matters never queues behind a stale one.
# Push runs on main and epic branches are never cancelled.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every job names ubuntu-26.04, not ubuntu-latest, so a new runner image
  # cannot change the build unannounced.
  secrets:
    name: Secret scan
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    # The action lists the pull request's commits, which a private
    # repository does not show without this permission.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docs:
    name: Docs and comments
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Check Markdown links and images
        run: python3 scripts/check-docs-links.py
      - name: Check comments for project history
        run: node scripts/check-comment-history.mjs

  prototype:
    name: Prototype
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: prototype/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
