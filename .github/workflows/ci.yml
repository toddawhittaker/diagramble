name: CI

on:
  pull_request:
    branches: [main, "epic/**"]
  push:
    branches: [main, "epic/**"]

permissions:
  contents: read

# A new push to a pull request cancels that pull request's run on the
# older commit, so the run that matters never queues behind a stale one.
# Push runs on main and epic branches are never cancelled.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every job names ubuntu-26.04, not ubuntu-latest, so a new runner image
  # cannot change the build unannounced.
  secrets:
    name: Secret scan
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    # The action lists the pull request's commits, which a private
    # repository does not show without this permission.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docs:
    name: Docs and comments
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Check Markdown links and images
        run: node scripts/check-docs-links.mjs
      - name: Check comments for project history
        run: node scripts/check-comment-history.mjs

  prototype:
    name: Prototype
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: prototype/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  app-checks:
    name: App checks
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      # The image build waits for the file it needs.
      - name: Build the Docker image
        if: hashFiles('Dockerfile') != ''
        run: docker build .

  # The tests run in a job of their own, so a test or coverage failure shows
  # as its own red check.
  app-tests:
    name: App tests
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      # Throwaway credentials for the service container below; they open
      # nothing outside this job.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/diagramble_test
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: diagramble_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Fails when coverage falls below 75% (CLAUDE.md, "Testing rules").
      - run: npm test
      # The browser steps wait for the file they need.
      - name: Install the browser for the browser tests
        if: hashFiles('apps/web/playwright.config.ts') != ''
        working-directory: apps/web
        run: npx playwright install --with-deps --only-shell chromium
      - name: Run the browser tests
        if: hashFiles('apps/web/playwright.config.ts') != ''
        run: npm run test:browser
